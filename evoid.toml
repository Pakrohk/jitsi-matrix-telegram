[service]
name = "matrix-jitsi-bot"
version = "0.1.0"

[engines]
storage = "memory"
cache = "memory"
schema = "native"
serializer = "json"
logger = "structlog"

[engines.options.jitsi]
server_url = ""
muc_domain = ""
admin_username = ""
admin_password = ""

[pipeline]
processors = ["validate", "authorize"]
