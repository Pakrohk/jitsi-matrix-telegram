[service]
name = "telebot"
version = "0.1.0"

[runtime]
adapter = "telegram"
host = "0.0.0.0"
port = 8001

[engines]
schema = "native"
storage = "memory"
cache = "memory"
logger = "loguru"

[pipeline]
processors = ["validate", "authorize"]

# Telegram-specific config
[telegram]
# Token is loaded from config.yaml or TELEGRAM_TOKEN env var
parse_mode = "HTML"

# Proxy settings
[proxy]
enabled = false
type = "socks5"
host = "127.0.0.1"
port = 1080
