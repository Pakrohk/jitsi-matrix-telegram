[service]
name = "telebot"
version = "0.1.0"

[runtime]
adapter = "telegram"
host = "0.0.0.0"
port = 8001

[engines]
schema = "native"
storage = "memory"
cache = "memory"
logger = "loguru"

[pipeline]
processors = ["validate", "authorize"]

# ── Telegram Config ──────────────────────────────────────────────────────────
# EVOID extracts sub-tables from [engines] as options
[engines.telegram]
token = ""  # or TELEGRAM_TOKEN env var
parse_mode = "HTML"

# ── Proxy Config ─────────────────────────────────────────────────────────────
[engines.proxy]
enabled = false
type = "socks5"    # socks5, socks4, http
host = "127.0.0.1"
port = 1080
# username = ""
# password = ""

# ── Jitsi Config ─────────────────────────────────────────────────────────────
[engines.jitsi]
server_url = "https://meet.example.com"
muc_domain = "conference.meet.example.com"

# ── Admin Config ─────────────────────────────────────────────────────────────
[engines.admin]
whitelist = []     # Telegram user IDs
require_auth = false
