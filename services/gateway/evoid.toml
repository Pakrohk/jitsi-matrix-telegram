[service]
name = "gateway"
version = "0.1.0"

[runtime]
adapter = "asgi"
host = "0.0.0.0"
port = 8000

[engines]
schema = "native"
storage = "memory"
cache = "memory"
logger = "loguru"

[pipeline]
processors = ["validate", "authorize", "audit", "protect"]

# ── Jitsi Config ─────────────────────────────────────────────────────────────
[engines.jitsi]
server_url = "https://meet.example.com"
muc_domain = "conference.meet.example.com"

# ── Admin Config ─────────────────────────────────────────────────────────────
[engines.admin]
whitelist = []
require_auth = false

# ── Rate Limiting ────────────────────────────────────────────────────────────
[engines.rate_limit]
enabled = true
max_requests = 100
window_seconds = 60