# Jitsi Bot Maubot Plugin Configuration
# Uses evoid-maubot plugin for EVOID integration

# EVOID service name
service_name: jitsi-matrix

# Command prefix (without !)
command_prefix: jitsi

# Maximum message length (Matrix limit)
max_message_length: 4000

# Jitsi server settings
jitsi:
  server_url: "https://meet.example.com"
  muc_domain: "conference.meet.example.com"
  prosody_modules: true
  admin_username: ""
  admin_password: ""

# Storage settings
storage:
  db_path: "jitsi-bot.db"

# Admin settings
admin:
  whitelist: []
  require_auth: false

# Rate limiting
rate_limit:
  enabled: true
  max_commands: 30
  window_seconds: 60
