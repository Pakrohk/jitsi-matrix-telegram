# Jitsi Maubot Plugin Configuration

# EVOID service name for this bot instance
service_name: jitsi-matrix

# Command prefix (without !)
command_prefix: jitsi

# Jitsi server configuration
jitsi:
  # Jitsi Meet server URL (e.g., https://meet.example.com)
  server_url: ""
  # MUC domain (e.g., conference.meet.example.com)
  muc_domain: ""
  # Admin credentials for moderator commands
  admin_username: ""
  admin_password: ""

# Storage configuration
storage:
  # SQLite database file path
  db_path: jitsi-bot.db
  # Enable smart storage routing (requires evoid-smart-storage)
  enable_smart_routing: true
  # Smart storage mapping (namespace -> storage backend)
  smart_mapping:
    meeting: storage.sqlite
    user_preference: storage.sqlite
    watch_party: storage.sqlite
    moderator_log: storage.sqlite
  # Smart storage schemas (namespace -> field list)
  smart_schemas:
    meeting: ["room_id", "room_name", "creator", "created_at", "url"]
    user_preference: ["user_id", "key", "value"]
    watch_party: ["room_id", "video_url", "content_type", "creator"]

# Who can use admin commands (Matrix user IDs)
admin_whitelist: []